<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="analytics-platform-title analytics-platform-desc" id="analytics-platform-root"><title id="analytics-platform-title">Olist platform architecture</title><desc id="analytics-platform-desc">Olist reporting in EU with separate historical GA4 US, consent-controlled commerce EU, synthetic experiments, FX and local orchestration.</desc><defs>
      <style>#analytics-platform-root .diagram-container { width:100%;overflow-x:auto }</style><marker id="analytics-platform-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#86d8ba"/></marker></defs><rect x="0" y="0" width="1200" height="1440" rx="0" fill="#e4ede5" stroke="#e4ede5"/><rect x="0" y="0" width="1200" height="556" rx="0" fill="#101b1b" stroke="#101b1b"/><text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#86d8ba" font-weight="700">OLIST / PLATFORM ARCHITECTURE</text><text x="40" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="46" fill="#f1f6ef" font-weight="700">Evidence, all the way through.</text><text x="40" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c2d3cc" font-weight="400">One core analytics pipeline. Independent paths with explicit boundaries.</text><text x="40" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#86d8ba" font-weight="700">01  /  OLIST MARKETPLACE</text><text x="1016" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#86d8ba" font-weight="700">BIGQUERY EU</text><path d="M232 264 H272" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><path d="M464 264 H504" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><path d="M696 264 H736" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><path d="M928 264 H968" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><rect x="40" y="220" width="192" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="56" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">Olist CSVs</text><text x="56" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">9 source tables</text><rect x="272" y="220" width="192" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="288" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">Python</text><text x="288" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">Manual ingestion</text><rect x="504" y="220" width="192" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="520" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">BigQuery</text><text x="520" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">RAW datasets</text><rect x="736" y="220" width="192" height="88" rx="8" fill="#86d8ba" stroke="#44645a"/><text x="752" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#101b1b" font-weight="700">dbt · dev</text><text x="752" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173d32" font-weight="400">24 models</text><rect x="968" y="220" width="192" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="984" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">Power BI</text><text x="984" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">Pages 1–5</text><path d="M832 308 V344 H216 V376 M832 344 H616 V376" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><rect x="40" y="376" width="352" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="56" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">Weekly revenue snapshot</text><text x="56" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">Retrospective forecasting</text><rect x="440" y="376" width="392" height="88" rx="8" fill="#172927" stroke="#44645a"/><text x="456" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#f1f6ef" font-weight="700">Monthly KPIs → Gemini</text><text x="456" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a6bbb2" font-weight="400">Pydantic + numeric validation</text><text x="888" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#c2d3cc" font-weight="400">Marts supply both branches.</text><text x="888" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#c2d3cc" font-weight="400">Power BI does not feed AI.</text><text x="40" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86d8ba" font-weight="700">REGION ISOLATION</text><text x="232" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#c2d3cc" font-weight="400">EU and US remain separate. No cross-region joins are implied.</text><rect x="32" y="580" width="1136" height="176" rx="8" fill="#f1f6ef" stroke="#ceded4"/><text x="56" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24785c" font-weight="700">02</text><text x="92" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#142e29" font-weight="700">HISTORICAL PRODUCT ANALYTICS</text><text x="1032" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24785c" font-weight="700">US</text><text x="56" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Public GA4 sample</text><text x="56" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Jan 25–31, 2021</text><text x="340" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">dbt · ga4_dev</text><text x="340" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">4 models</text><text x="624" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Session funnel</text><text x="624" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Custom attribution</text><text x="908" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Power BI</text><text x="908" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Separate 3-page report</text><path d="M264 644 H320" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><path d="M548 644 H604" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><path d="M832 644 H888" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><text x="56" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Historical, obfuscated events — independent of Olist transactions.</text><rect x="32" y="780" width="1136" height="280" rx="8" fill="#f1f6ef" stroke="#ceded4"/><text x="56" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24785c" font-weight="700">03</text><text x="92" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#142e29" font-weight="700">CONSENT-CONTROLLED COMMERCE</text><text x="1092" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24785c" font-weight="700">EU</text><text x="56" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Local storefront</text><text x="56" y="890" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Canonical event contract</text><path d="M248 856 H288 Q296 856 296 864 V984 M296 856 V840 H336 M296 920 H336 M296 984 H336" fill="none" stroke="#24785c" stroke-width="2"/><text x="352" y="852" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Offline inspector</text><text x="352" y="878" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Local evidence / default path</text><text x="352" y="932" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">PostHog EU</text><text x="352" y="958" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Opt-in / verified manual export</text><text x="744" y="932" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">RAW import → dbt</text><text x="744" y="958" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">commerce_dev · 4 models</text><path d="M664 924 H724" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><text x="352" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">GTM Preview → GA4</text><text x="352" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Opt-in / native daily export</text><text x="744" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">EU dbt → Power BI p8</text><text x="744" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">ga4_commerce_dev · 2 models</text><path d="M664 988 H724" fill="none" stroke="#86d8ba" stroke-width="2" marker-end="url(#analytics-platform-arrow)"/><text x="56" y="1044" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">PostHog native export unverified. GA4 source-to-warehouse reconciliation pending.</text><rect x="32" y="1084" width="552" height="188" rx="8" fill="#d4e9de" stroke="#b5cfc0"/><rect x="608" y="1084" width="560" height="188" rx="8" fill="#f1f6ef" stroke="#ceded4"/><text x="56" y="1116" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24785c" font-weight="700">04 / SYNTHETIC EXPERIMENTS</text><text x="56" y="1156" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Generated outcomes → inference</text><text x="56" y="1182" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Power · inference · SRM · hypothetical economics</text><text x="56" y="1216" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#142e29" font-weight="600">CSV fixtures → Power BI A/B pages 6–7</text><text x="56" y="1246" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Disconnected from observed Olist KPIs.</text><text x="632" y="1116" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24785c" font-weight="700">05 / INDEPENDENT FX</text><text x="632" y="1156" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142e29" font-weight="700">Frankfurter → Python → BigQuery RAW</text><text x="632" y="1182" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#49665a" font-weight="400">Validated currency rows / independent ingestion</text><text x="632" y="1216" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#142e29" font-weight="600">No FX dependency in Olist metrics.</text><rect x="32" y="1296" width="1136" height="112" rx="8" fill="#172927" stroke="#44645a"/><text x="56" y="1326" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#86d8ba" font-weight="700">06 / LOCAL AIRFLOW · TASK ORDER</text><text x="56" y="1360" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f6ef" font-weight="600">FX ingestion → Olist dbt run → dbt tests → AI commentary</text><text x="56" y="1390" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c2d3cc" font-weight="400">Excludes incremental demo; does not load CSVs, refresh BI, run GA4 or execute forecasting.</text></svg>
