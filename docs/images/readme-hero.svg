<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Olist analytics engineering platform: commerce data, modeled in BigQuery and dbt, delivered as dashboards and decisions."><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.line{stroke-dasharray:8 9;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-68}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><rect width="1200" height="380" rx="22" fill="#101b1b"/><path d="M0 300H1200" stroke="#2b4440"/><text x="56" y="65" fill="#86d8ba" font-size="15" letter-spacing="3">OLIST / ANALYTICS ENGINEERING</text><text x="56" y="132" fill="#f1f6ef" font-size="43" font-weight="700">Evidence, all the way through.</text><text x="56" y="174" fill="#a6bbb2" font-size="19">Ingest → model → validate → explain → decide</text><g fill="#172927" stroke="#44645a"><rect x="56" y="222" width="236" height="88" rx="12"/><rect x="342" y="222" width="236" height="88" rx="12"/><rect x="628" y="222" width="236" height="88" rx="12"/><rect x="914" y="222" width="230" height="88" rx="12"/></g><g fill="#86d8ba" font-size="16" font-weight="600"><text x="82" y="258">SOURCE</text><text x="82" y="285" fill="#c2d3cc" font-size="14">Olist · GA4 · FX</text><text x="368" y="258">WAREHOUSE</text><text x="368" y="285" fill="#c2d3cc" font-size="14">BigQuery · EU / US</text><text x="654" y="258">MODELS</text><text x="654" y="285" fill="#c2d3cc" font-size="14">dbt · tests · marts</text><text x="940" y="258">DECISIONS</text><text x="940" y="285" fill="#c2d3cc" font-size="14">Power BI · experiments</text></g><g class="line" fill="none" stroke="#86d8ba" stroke-width="2"><path d="M292 266H342"/><path d="M578 266H628"/><path d="M864 266H914"/></g><text x="56" y="348" fill="#78938a" font-size="14">Reproducible analysis, explicit boundaries, inspectable evidence.</text></svg>