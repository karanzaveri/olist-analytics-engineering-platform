name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-parse:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt-ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-docker.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Create temporary dbt profile
        shell: bash
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'YAML'
          analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: ci-placeholder-project
                dataset: ci_placeholder
                threads: 1
          YAML

      - name: Parse dbt project
        working-directory: analytics
        run: dbt parse

      - name: Validate GA4 parsing and target isolation offline
        run: python analytics/ci/validate_ga4.py
