version: 2
models:
  - name: stg_ga4_commerce_events
    description: Native daily commerce deliveries with original GA4 records, canonical fields and a validity flag. Delivery grain is preserved for audit and reconciliation.
    columns:
      - name: event_id
        description: Original app event UUID from the exported event parameter.
      - name: occurred_at
        description: Canonical source timestamp used for ordering, separate from native_event_timestamp.
      - name: payload_hash
        description: Hash of normalized canonical content, excluding vendor delivery metadata.
      - name: is_valid
        description: Whether the row meets the supported synthetic commerce schema and amount checks.
  - name: fct_ga4_commerce_session_funnel
    description: Ordered funnel flags and distinct qualified purchases for one canonical app session within the selected daily shard.
    columns:
      - name: session_key
        description: Serialized environment, origin, run, app anonymous ID and app session ID.
        data_tests: [not_null, unique]
      - name: logical_purchases
        description: Distinct qualifying order IDs after excluding conflicting order signatures.
      - name: stage_reached
        description: Deepest qualified ordered stage, from zero through four.
        data_tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4]
              quote: false
