name: 'analytics'
version: '1.0.0'

profile: 'analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics:
    staging:
      +materialized: view
      +enabled: "{{ target.name == 'dev' }}"

    intermediate:
      +materialized: view
      +enabled: "{{ target.name == 'dev' }}"

    marts:
      +materialized: table
      +enabled: "{{ target.name == 'dev' }}"

    ga4:
      +enabled: "{{ target.name == 'ga4_dev' }}"
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table

    commerce:
      +enabled: "{{ target.name == 'commerce_dev' }}"
      +materialized: view
      fct_commerce_session_funnel:
        +materialized: table

    ga4_commerce:
      +enabled: "{{ target.name == 'ga4_commerce_dev' }}"
      +materialized: view
      fct_ga4_commerce_session_funnel:
        +materialized: table

seeds:
  analytics:
    commerce:
      +enabled: "{{ target.name == 'commerce_dev' }}"
